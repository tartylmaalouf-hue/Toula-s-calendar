<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Emploie du temps</title>
        <link rel="stylesheet" href="schedule.css">
        <link href="https://fonts.cdnfonts.com/css/pixeboy" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
         
    </head>

    <body>
        <div id="schedule_app">
            <div id="daysbox">
                <div id="title">Toula's calendar</div>
                <div class="hour" id="hour1">88:88</div>
                <div class="date"><span id=jour_semaine_actuel>ven. </span> <span id=jour_actuel>18</span> <span id="mois_actuel">09</span> <span id="année_actuelle"></span></div>
                <div class="hour" id="hour2"><span id="heure_actuelle">21</span><span class="clignotant">:</span><span id="minute_actuelle">56</span></div>                
                <div class="day" id="monday">Lundi</div>
                <div class="day" id="tuesday">Mardi</div>
                <div class="day" id="wednesday">Mercredi</div>
                <div class="day" id="thursday">Jeudi</div>
                <div class="day" id="friday">Vendredi</div>
                <div class="day" id="saturday">Samedi</div>
                <div class="day" id="sunday">Dimanche</div>
            </div>
            <div id="edtbox">
                <div id="edt">
                    <div id="heures">
                        <div id="barreh"></div>
                        <div class="heure" id="h7"><span class="label_heure">07:00</span></div>
                        <div class="heure" id="h8"><span class="label_heure">08:00</span></div>
                        <div class="heure" id="h9"><span class="label_heure">09:00</span></div>
                        <div class="heure" id="h10"><span class="label_heure">10:00</span></div>
                        <div class="heure" id="h11"><span class="label_heure">11:00</span></div>
                        <div class="heure" id="h12"><span class="label_heure">12:00</span></div>
                        <div class="heure" id="h13"><span class="label_heure">13:00</span></div>
                        <div class="heure" id="h14"><span class="label_heure">14:00</span></div>
                        <div class="heure" id="h15"><span class="label_heure">15:00</span></div>
                        <div class="heure" id="h16"><span class="label_heure">16:00</span></div>
                        <div class="heure" id="h17"><span class="label_heure">17:00</span></div>
                        <div class="heure" id="h18"><span class="label_heure">18:00</span></div>
                        <div class="heure" id="h19"><span class="label_heure">19:00</span></div>
                        <div class="heure" id="h20"><span class="label_heure">20:00</span></div>
                        <div class="heure" id="h21"><span class="label_heure">21:00</span></div>
                        <div class="heure" id="h22"><span class="label_heure">22:00</span></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="schedule.js"></script>
    </body>

</html>
